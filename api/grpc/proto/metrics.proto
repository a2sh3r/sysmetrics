syntax = "proto3";

package metrics;

option go_package = "github.com/a2sh3r/sysmetrics/proto/metrics";

service MetricsService {
  rpc UpdateMetric(UpdateMetricRequest) returns (UpdateMetricResponse);
  rpc UpdateMetricsBatch(UpdateMetricsBatchRequest) returns (UpdateMetricsBatchResponse);
  rpc GetMetric(GetMetricRequest) returns (GetMetricResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
}

message Metric {
  string id = 1;
  string type = 2; 
  double value = 3;
  int64 delta = 4;
}

message UpdateMetricRequest {
  Metric metric = 1;
}

message UpdateMetricResponse {
  bool success = 1;
  string error = 2;
}

message UpdateMetricsBatchRequest {
  repeated Metric metrics = 1;
}

message UpdateMetricsBatchResponse {
  bool success = 1;
  string error = 2;
}

message GetMetricRequest {
  string id = 1;
  string type = 2;
}

message GetMetricResponse {
  Metric metric = 1;
  bool found = 2;
  string error = 3;
}

message GetMetricsRequest {}

message GetMetricsResponse {
  repeated Metric metrics = 1;
  string error = 2;
}